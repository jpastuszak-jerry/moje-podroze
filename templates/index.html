<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Podróże">
<meta name="theme-color" content="#1a6fdb">
<title>Moje Podróże</title>
<link rel="manifest" href="/static/manifest.json?v={{ asset_version }}">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png?v={{ asset_version }}">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png?v={{ asset_version }}">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png?v={{ asset_version }}">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}">
<script>
  (function() {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body{% if not is_authenticated %} class="auth-page"{% endif %}>
<div id="offline-banner" role="status" aria-live="polite">
  <span>Tryb offline</span><span id="offline-banner-sync"></span>
</div>
{% if is_authenticated %}
<div id="app-menu" class="app-menu">
  <button id="app-menu-button" class="app-menu-button" onclick="toggleAppMenu(event)" type="button"
          aria-haspopup="menu" aria-expanded="false" aria-label="Konto i wygląd" title="Konto i wygląd">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 14a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>
    </svg>
  </button>
  <div id="app-menu-panel" class="app-menu-panel" role="menu" aria-label="Konto i wygląd">
    <div class="app-menu-title">Konto i wygląd</div>
    <button class="app-menu-item" onclick="toggleTheme(); closeAppMenu();" type="button" role="menuitem">
      <span class="app-menu-icon"><svg id="theme-icon" viewBox="0 0 24 24" aria-hidden="true"></svg></span>
      <span class="app-menu-text"><span class="app-menu-label">Motyw</span><span class="app-menu-sub" id="theme-menu-label">Systemowy</span></span>
    </button>
    <button class="app-menu-item danger" onclick="logoutAdmin()" type="button" role="menuitem">
      <span class="app-menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17v-3H3v-4h7V7l5 5-5 5zm2 4v-2h7V5h-7V3h9v18h-9z"/></svg></span>
      <span class="app-menu-text"><span class="app-menu-label">Wyloguj</span><span class="app-menu-sub">Zamknij sesje admina</span></span>
    </button>
  </div>
</div>
<div id="app">
  <div id="view"></div>
  <nav id="tabs">
    <button class="tab active" onclick="showTab('travels')" id="tab-travels">
      <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
      Podróże
    </button>
    <button class="tab" onclick="showTab('locations')" id="tab-locations">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
      Miejsca
    </button>
    <button class="tab" onclick="showTab('map')" id="tab-map">
      <svg viewBox="0 0 24 24"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
      Mapa
    </button>
    <button class="tab" onclick="showTab('stats')" id="tab-stats">
      <svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
      Statystyki
    </button>
  </nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="/static/js/utils.js?v={{ asset_version }}"></script>
<script src="/static/js/components.js?v={{ asset_version }}"></script>
<script src="/static/js/map.js?v={{ asset_version }}"></script>
<script src="/static/js/travels.js?v={{ asset_version }}"></script>
<script src="/static/js/locations.js?v={{ asset_version }}"></script>
<script src="/static/js/dictionaries.js?v={{ asset_version }}"></script>
<script src="/static/js/persons.js?v={{ asset_version }}"></script>
<script src="/static/js/stats_yearbook.js?v={{ asset_version }}"></script>
<script src="/static/js/stats.js?v={{ asset_version }}"></script>
<script src="/static/js/todo.js?v={{ asset_version }}"></script>
<script src="/static/js/wizard.js?v={{ asset_version }}"></script>
<script>
setThemeIcon();
updateOfflineBanner();
startRouter();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function(err) {
      console.warn('SW registration failed:', err);
    });
  });
}
async function clearPrivateOfflineData() {
  if ('caches' in window) {
    const keys = await caches.keys();
    await Promise.all(keys.filter(function(key) {
      return key.indexOf('travel-') === 0;
    }).map(function(key) { return caches.delete(key); }));
  }
  if ('indexedDB' in window) {
    await new Promise(function(resolve) {
      var req = indexedDB.deleteDatabase('travel-mirror');
      req.onsuccess = req.onerror = req.onblocked = function() { resolve(); };
    });
  }
}
async function logoutAdmin() {
  try {
    await fetch('/api/auth/logout', { method: 'POST' });
    await clearPrivateOfflineData();
  } finally {
    window.location.reload();
  }
}
</script>
{% else %}
<main class="login-shell">
  <section class="login-panel" aria-labelledby="login-title">
    <div class="login-brand">Moje Podróże</div>
    <h1 id="login-title">Logowanie administratora</h1>
    {% if auth_configured %}
    <form class="login-form" onsubmit="submitLogin(event)">
      <label for="admin-password">Hasło</label>
      <input id="admin-password" name="password" type="password" autocomplete="current-password"
             enterkeyhint="go" autocapitalize="none" autocorrect="off" spellcheck="false">
      <button id="login-submit" type="submit">Zaloguj</button>
      <div id="login-error" class="login-error" role="alert" aria-live="polite"></div>
    </form>
    {% else %}
    <div class="login-error visible">Brak konfiguracji logowania. Ustaw `ADMIN_PASSWORD_HASH` albo `ADMIN_PASSWORD` w zmiennych środowiskowych.</div>
    {% endif %}
  </section>
</main>
<script>
async function submitLogin(event) {
  event.preventDefault();
  var input = document.getElementById('admin-password');
  var button = document.getElementById('login-submit');
  var error = document.getElementById('login-error');
  error.textContent = '';
  error.classList.remove('visible');
  button.disabled = true;
  button.textContent = 'Loguję...';
  try {
    input.blur();
    await new Promise(function(resolve) { requestAnimationFrame(resolve); });
    var response = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: input.value })
    });
    var body = await response.json().catch(function() { return {}; });
    if (!response.ok) {
      error.textContent = body.error || 'Nie udało się zalogować';
      error.classList.add('visible');
      button.disabled = false;
      button.textContent = 'Zaloguj';
      return;
    }
    window.location.reload();
  } catch (err) {
    error.textContent = 'Błąd sieci. Spróbuj ponownie.';
    error.classList.add('visible');
    button.disabled = false;
    button.textContent = 'Zaloguj';
  }
}
</script>
{% endif %}
</body>
</html>
