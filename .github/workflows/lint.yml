name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python -m py_compile app.py core.py travels.py locations.py dicts.py stats.py schemas.py migrate.py
      - run: python -m unittest discover -s tests
      - run: node tools/smoke_js.mjs
